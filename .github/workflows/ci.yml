name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.7.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Verify SHACL schema parses
        run: uv run python -c "from rdflib import Graph; Graph().parse('../schema/schema.ttl', format='turtle'); print('schema.ttl parses OK')"

      - name: Run Python tests
        # -c pyproject.toml: pytest can't auto-discover backend/ config from
        # ../tests/, so point it at the backend project's [tool.pytest.ini_options].
        run: uv run python -m pytest -c pyproject.toml ../tests/

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend

      - name: Lint frontend
        run: |
          npm run lint --prefix frontend

      - name: Build frontend
        run: |
          npm run build --prefix frontend
