name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # Linting is handled by pre-commit hooks and ruff, not flake8

      - name: Run Python tests
        run: |
          PYTHONPATH=. python -m pytest tests/

      - name: Generate API documentation
        run: |
          pip install pdoc
          pdoc --output-dir docs rfdbtools

      - name: Validate RDF data against SHACL shapes
        run: |
          python -m rfdbtools.validator --data data/data.ttl --schema schema/schema.ttl
