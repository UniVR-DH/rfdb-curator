[project]
name = "rfdbtools"
description = "RDF/SHACL curation and tooling for Russian theatrical works/libretti."
version = "0.1.0"
requires-python = ">=3.11"
authors = [
	{ name = "UniVR-DH", email = "your-email@example.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "rdflib==7.6.0",
    "pyshacl==0.31.0",
]

[project.optional-dependencies]
excel = [
    "pandas==3.0.2",
    "openpyxl==3.1.5",
]

[project.scripts]
rfdbtools = "rfdbtools.run:main"

[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rfdbtools*"]
exclude = ["tests*", "data*", "schema*", "explorer*", "excel_out*", "validation_reports*", "tools*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    'ignore:ConjunctiveGraph is deprecated, use Dataset instead\.:DeprecationWarning:rdflib.plugins.parsers.jsonld',
]

[tool.flake8]
max-line-length = 88
exclude = [".venv", "__pycache__", "build", "dist"]

[dependency-groups]
dev = [
    "flake8==7.3.0",
    "pytest==9.0.3",
]
