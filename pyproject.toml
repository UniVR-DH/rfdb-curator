[project]
name = "rfdb-curator"
description = "Standalone SHACL-driven editor stack for RossijskijFeatrDB."
version = "0.1.0"
requires-python = ">=3.11"
authors = [
    { name = "UniVR-DH", email = "your-email@example.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "rdflib==7.6.0",
    "pyshacl==0.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    'ignore:ConjunctiveGraph is deprecated, use Dataset instead\.:DeprecationWarning:rdflib.plugins.parsers.jsonld',
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]
