# docker-compose.prod.yml
#
# Production deployment for RossijskijFeatrDB.
#
# Changes from the dev compose file, and why:
#   - No source bind-mounts, no --reload: containers run only what was
#     COPYed into the image at build time, nothing from the host fs.
#   - Oxigraph publishes no port at all. It has no auth of its own, so
#     anyone who can reach 7878 has full SPARQL read/write access —
#     it must only be reachable from the backend, over the `internal`
#     network.
#   - Backend and frontend also publish no ports. The only host-facing
#     service is `proxy`, which terminates TLS and reverse-proxies to
#     both, over the `edge` network. This also lets frontend and
#     backend share one origin, so CORS becomes a non-issue if you
#     route /api through the same domain.
#   - Frontend is built as static assets (`npm run build` / `vite
#     build`) and served by whatever the Dockerfile's prod stage runs
#     (e.g. nginx) — not the Vite dev server, which isn't meant to
#     serve production traffic.
#   - Config with no safe default uses `${VAR:?message}` so `docker
#     compose up` fails immediately instead of silently deploying with
#     a dev value or an empty one.
#
# Requires (not included in this file):
#   - frontend/Dockerfile needs a build stage that runs the production
#     build and serves ./dist with a real web server.
#   - proxy/Caddyfile (or nginx.conf + certbot) with your actual domain
#     and TLS config.
#   - .env.prod populated from .env.prod.example.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down        # keeps volumes
#   docker compose -f docker-compose.prod.yml down -v     # destroys data too

services:

  # --------------------------------------------------------------------------
  # Oxigraph — RDF triple store
  # --------------------------------------------------------------------------
  oxigraph:
    image: oxigraph/oxigraph:0.5.7
    container_name: rfdb-oxigraph
    restart: unless-stopped
    # No `ports:` — unauthenticated triple store, must stay
    # unreachable from outside the Docker network.
    networks:
      - internal
    volumes:
      - oxigraph_data:/data
    security_opt:
      - no-new-privileges:true
    # Root filesystem read-only; the only writes the process needs are
    # under /data (named volume, mounted read-write) and /tmp. Remove
    # this if you hit permission errors and can't find where else it
    # writes.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # Liveness only, same rationale as dev: distroless image has no
      # shell/curl/wget. HTTP readiness is checked separately by the
      # backend's own startup retry loop before it seeds data.
      test: ["CMD", "/usr/local/bin/oxigraph", "--help"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
      # Note: `docker compose` (the Go-based v2 CLI) applies
      # deploy.resources.limits directly even outside Swarm. If you're
      # still on the legacy python docker-compose v1 binary, this block
      # is silently ignored — use top-level `mem_limit`/`cpus` instead.

  # --------------------------------------------------------------------------
  # Backend — FastAPI + uvicorn
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rfdb-backend
    restart: unless-stopped
    depends_on:
      oxigraph:
        condition: service_healthy
    networks:
      - internal   # to reach oxigraph
      - edge       # to be reached by proxy
    environment:
      OXIGRAPH_URL: http://oxigraph:7878      
      DATA_GRAPH_URI: "https://rosfeatr.eu/rdf/graph/"
      SCHEMA_PATH: /app/schema/schema.ttl
      VOCAB_PATH: /app/data/vocab.ttl
      DATA_PATH: /app/data/data.ttl

      # Hardcoded rather than env-overridable: a stray
      # RESET_DATA_ON_STARTUP=true in a misconfigured .env.prod would
      # wipe the store on every restart. If you ever need a genuine
      # prod reset, change this literal for one deploy, don't add an
      # override knob for it.
      RESET_DATA_ON_STARTUP: "false"
      SEED_VOCAB_ON_STARTUP: "true"
      SEED_TEST_DATA_ON_STARTUP: "false"

      READ_ONLY: "${READ_ONLY:-false}"
      # Per-shape read-only: mirrors docker-compose.yml (dev) so the seeded
      # Glottolog language vocabulary stays reference-only in production too.
      READ_ONLY_SHAPES: '["https://rosfeatr.eu/rdf/schema/LanguageShape"]'

      # No default on purpose: failing to start is safer than silently
      # falling back to a dev localhost origin, or to an empty/broken
      # CORS policy. Set in .env.prod, e.g.
      # CORS_ORIGINS=["https://rfdb.example.com"]
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.prod}

      LOG_FILE: logs/app.jsonl
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TRUNCATE_LOG_ON_STARTUP: "false"
      TRUNCATE_LOG_ON_FRESH_CONTAINER_START: "true"
    volumes:
      # No ./backend:/app — the running code is whatever the image
      # contains, not the host checkout.
      - ./schema:/app/schema:ro
      - ./data:/app/data:ro
      # Persist JSON-lines logs in a Docker-managed volume to avoid
      # host uid/gid permission issues on first deploy.
      - backend_logs:/app/logs
    # No `ports:` — only `proxy` reaches this, over `edge`.
    # No --reload. --workers is a placeholder: size it to roughly
    # (2 x CPU cores) + 1 for your actual VM, not this default.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      # Bounds Docker's own captured stdout/stderr. Does NOT bound
      # /app/logs/app.jsonl — that's app-level file logging in the
      # backend_logs Docker volume, and needs its own in-volume
      # cleanup/rotation.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  # --------------------------------------------------------------------------
  # Frontend — static build, served by the prod stage's web server
  # (e.g. nginx inside the image). Not the Vite dev server: `vite
  # preview` and the dev server aren't built to sit behind a reverse
  # proxy and take production traffic.
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Vite inlines VITE_* values into the JS bundle at build time.
      # Unlike the backend, setting these under `environment:` below
      # would have NO effect on a static build — there's no server
      # reading env vars per-request once it's just prebuilt HTML/JS.
      # Must be a build arg, read via ARG/ENV in the Dockerfile before
      # `npm run build` runs.
      args:
        VITE_API_BASE: ${VITE_API_BASE:?Set VITE_API_BASE in .env.prod, e.g. https://rfdb.example.com/api}
    container_name: rfdb-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    # No `ports:` — only `proxy` reaches this.
    # No bind-mounts, no anonymous node_modules volume: nothing here
    # watches the filesystem, so neither would do anything useful.

  # --------------------------------------------------------------------------
  # Proxy — the only service exposed to the host. Terminates TLS and
  # reverse-proxies to frontend (static assets) and backend (API), so
  # the browser sees one origin and CORS_ORIGINS above can just be
  # that domain instead of a second port.
  #
  # Caddyfile/nginx.conf not included here — needs your real domain
  # and cert config before this will work.
  # --------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    container_name: rfdb-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    networks:
      - edge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  # oxigraph <-> backend only. Nothing else, and nothing on the host,
  # can reach oxigraph directly.
  internal:
    driver: bridge
  # proxy <-> backend/frontend. Has no route to the host except
  # through proxy's own published ports.
  edge:
    driver: bridge

# ------------------------------------------------------------------------------
# Named volumes
# ------------------------------------------------------------------------------
volumes:
  oxigraph_data:
  backend_logs:
  caddy_data:
  caddy_config: