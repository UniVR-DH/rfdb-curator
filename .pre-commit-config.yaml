# Checks run on every commit: the commit message format, no machine-local
# absolute paths, the same ruff checks CI does, and prefix-map coverage.
# Install them once per clone, after installing the pre-commit tool
# (https://pre-commit.com); the ruff and prefix-map hooks also need uv on PATH:
#
#     pre-commit install
#
# default_install_hook_types makes that one command install the commit-msg
# hook too. default_stages keeps a hook added below without its own stages
# from also running on the commit message.
# Run manually against everything:
#   pre-commit run --all-files
#
# The hooks run ruff FROM THE REPO ROOT, matching CI. [tool.ruff] lives in the
# root pyproject.toml, and its explicit
# src = ["curator-backend", "dataexplorer-backend", "rfdb-core"] means first-party
# import detection no longer depends on the working directory — so
# there is nothing to keep in sync by cd-ing into a member. Running from the root
# is also what brings rfdb-core/ and tests/ into scope.
#
# The ruff version comes from the curator-backend project's dev dependency, resolved
# through the workspace's single root .venv. `env -u VIRTUAL_ENV` drops any stale
# activated-venv var so uv resolves that venv cleanly without a warning.
# `pass_filenames: false` lets ruff pick the files (`.` = the whole repo); each
# hook only fires when a matching .py is staged.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: commit-msg
        name: commit message format
        entry: scripts/hooks/commit-msg
        language: script
        stages: [commit-msg]
      - id: no-local-paths
        name: no machine-local absolute paths
        entry: scripts/hooks/no-local-paths
        language: script
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check (workspace)
        language: system
        entry: bash -c 'env -u VIRTUAL_ENV uv run --offline ruff check --fix .'
        pass_filenames: false
        files: ^((curator|dataexplorer)-backend|rfdb-core|tests)/.*\.py$
      - id: ruff-format
        name: ruff format (workspace)
        language: system
        entry: bash -c 'env -u VIRTUAL_ENV uv run --offline ruff format .'
        pass_filenames: false
        files: ^((curator|dataexplorer)-backend|rfdb-core|tests)/.*\.py$
      # Keep rfdb_core.prefixes.PREFIXES (served by
      # /api/v1/dataexplorer/meta/prefixes) in sync with the @prefix declarations
      # across the schema/data TTL files. Fires only when a TTL or the curated map
      # itself changes; the script picks the files.
      - id: prefix-map-check
        name: prefix-map coverage (rfdb-core/rfdb_core/prefixes.py vs TTL files)
        language: system
        entry: bash -c 'env -u VIRTUAL_ENV uv run --offline python curator-backend/scripts/check_prefixes.py'
        pass_filenames: false
        files: ^(schema/.*\.ttl|data/.*\.ttl|rfdb-core/rfdb_core/prefixes\.py)$
