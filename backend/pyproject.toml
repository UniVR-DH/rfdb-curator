[project]
name = "rfdb-editor-backend"
version = "0.1.0"
description = "FastAPI backend for the RossijskijFeatrDB editor"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]==0.44.0",
    "rdflib==7.6.0",
    "pyshacl==0.31.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-multipart==0.0.24",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]
